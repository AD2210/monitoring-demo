name: CD

on:
    push:
        tags: ['v*.*.*']
    workflow_dispatch:
        inputs:
            image_tag:
                description: Image tag to deploy
                required: true
                type: string

permissions:
    contents: read
    packages: write

env:
    IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/monitoring-demo

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/metadata-action@v5
              id: metadata
              with:
                  images: ${{ env.IMAGE_NAME }}
                  tags: |
                      type=sha
                      type=ref,event=tag

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  target: frankenphp_prod
                  push: true
                  tags: ${{ steps.metadata.outputs.tags }}
                  labels: ${{ steps.metadata.outputs.labels }}
                  build-args: |
                      MONITORING_BUNDLE_REPOSITORY=${{ vars.MONITORING_BUNDLE_REPOSITORY }}
                      MONITORING_BUNDLE_REF=develop

    deploy:
        needs: publish
        runs-on: ubuntu-latest
        environment: production
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Configure SSH
              env:
                  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
                  DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
              run: |
                  install -m 700 -d "$RUNNER_TEMP/ssh"
                  printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/deploy_key"
                  printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
                  chmod 600 "$RUNNER_TEMP/ssh/deploy_key" "$RUNNER_TEMP/ssh/known_hosts"

            - name: Upload Compose files
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
                  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
              run: |
                  scp -P "${DEPLOY_PORT:-22}" -i "$RUNNER_TEMP/ssh/deploy_key" \
                      -o BatchMode=yes -o StrictHostKeyChecking=yes \
                      -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
                      compose.yaml compose.prod.yaml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

            - name: Deploy with Docker Compose
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
                  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
                  IMAGE_TAG: ${{ github.ref_name }}
              run: |
                  ssh -p "${DEPLOY_PORT:-22}" -i "$RUNNER_TEMP/ssh/deploy_key" \
                      -o BatchMode=yes -o StrictHostKeyChecking=yes \
                      -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
                      "$DEPLOY_USER@$DEPLOY_HOST" \
                      "cd '$DEPLOY_PATH' && IMAGE_TAG='$IMAGE_TAG' IMAGE_NAME='$IMAGE_NAME' docker compose -f compose.yaml -f compose.prod.yaml pull && IMAGE_TAG='$IMAGE_TAG' IMAGE_NAME='$IMAGE_NAME' docker compose -f compose.yaml -f compose.prod.yaml up -d --remove-orphans --wait"
