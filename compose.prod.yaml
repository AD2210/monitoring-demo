services:
  php:
    image: ${IMAGE_NAME:-ghcr.io/ad2210/monitoring-demo}:${IMAGE_TAG:?Set IMAGE_TAG}
    build: !reset null
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET}
      MONITORING_APPLICATION_NAME: ${MONITORING_APPLICATION_NAME:?Set MONITORING_APPLICATION_NAME}
      MONITORING_HEALTH_TOKEN: ${MONITORING_HEALTH_TOKEN:?Set MONITORING_HEALTH_TOKEN}
      MONITORING_METRICS_TOKEN: ${MONITORING_METRICS_TOKEN:?Set MONITORING_METRICS_TOKEN}
      MONITORING_DEMO_DEPENDENCY_DOWN: ${MONITORING_DEMO_DEPENDENCY_DOWN:-0}
    volumes: !reset []
