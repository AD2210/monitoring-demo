services:
  php:
    build:
      context: .
      args:
        MONITORING_BUNDLE_REPOSITORY: ${MONITORING_BUNDLE_REPOSITORY:-https://github.com/AD2210/monitoring-bundle.git}
        MONITORING_BUNDLE_REF: ${MONITORING_BUNDLE_REF:-develop}
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET}
      MONITORING_APPLICATION_NAME: ${MONITORING_APPLICATION_NAME:-monitoring-demo}
      MONITORING_HEALTH_TOKEN: ${MONITORING_HEALTH_TOKEN:?Set MONITORING_HEALTH_TOKEN}
      MONITORING_METRICS_TOKEN: ${MONITORING_METRICS_TOKEN:?Set MONITORING_METRICS_TOKEN}
      MONITORING_DEMO_DEPENDENCY_DOWN: ${MONITORING_DEMO_DEPENDENCY_DOWN:-0}
      SERVER_NAME: ${SERVER_NAME:-localhost}
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped
