services:
  php:
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      CADDY_SERVER_NAME: ${CADDY_SERVER_NAME:-http://${SERVER_NAME:-localhost}}
      DEFAULT_URI: ${DEFAULT_URI:-https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}}

      SYMFONY_VERSION: ${SYMFONY_VERSION:-}
      STABILITY: ${STABILITY:-stable}
      ###< dunglas/symfony-docker ###
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - name: http
        host_ip: ${PHP_HOST:-127.0.0.1}
        target: 80
        published: ${PHP_PORT:-8080}
        protocol: tcp
